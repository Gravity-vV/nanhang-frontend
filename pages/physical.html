<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>物理层接入测试</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      background: #ffffff;
      color: #1f2937;
    }

    .page {
      height: 100%;
      display: grid;
      grid-template-columns: minmax(320px, 0.34fr) minmax(0, 0.66fr);
      grid-template-rows: minmax(0, 0.5fr) minmax(0, 0.5fr);
      grid-template-areas:
        "flow image"
        "controls logs";
      gap: 14px;
      padding: 12px 16px;
      min-height: 0;
      overflow: hidden;
    }

    .section {
      padding: 0;
      min-height: 0;
    }

    .page > .section {
      display: contents;
    }

    .section + .section {
      border-top: 0;
    }

    .hero-section {
      grid-area: image;
      min-height: 0;
    }

    .hero-scene {
      grid-area: image;
      width: 100%;
      height: 100%;
      padding: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
      background: #ffffff;
    }

    .physical-hero-layout {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 0.47fr) minmax(0, 0.53fr);
      gap: 12px;
    }

    .physical-left-stack {
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 3.7fr) minmax(120px, 0.85fr);
      gap: 20px;
    }

    .diagram-panel {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .panel-header {
      background: linear-gradient(to right, #2b4c7e, #567ebb);
      color: #ffffff;
      padding: 8px 16px;
      font-weight: 700;
      font-size: 18px;
      border-radius: 10px 10px 0 0;
      margin: 4px;
      flex: 0 0 auto;
    }

    .panel-header-secondary {
      background: linear-gradient(180deg, #edf4fc 0%, #d9e7f8 100%);
      color: #28415e;
      border: 1px solid #c5d6ea;
      font-size: 16px;
      font-weight: 700;
    }

    .physical-canvas {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #ffffff;
    }

    .physical-canvas--summary {
      padding: 20px 22px;
      display: grid;
      grid-template-rows: 1fr;
      gap: 0;
      background: #ffffff;
    }

    .physical-card-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .right-elements-boost image:not(.keep-transform),
    .right-elements-boost text,
    .right-elements-boost rect,
    .right-elements-boost line {
      transform-box: fill-box;
      transform-origin: center;
      transform: scale(1.2);
    }

    .svg-center-transform {
      transform-box: fill-box;
      transform-origin: center;
    }

    .physical-platform-chip {
      display: grid;
      place-items: center;
      min-height: 62px;
      border: 1px solid rgba(34, 211, 238, 0.72);
      border-radius: 14px;
      background:
        linear-gradient(135deg, rgba(34, 211, 238, 0.22), rgba(14, 165, 233, 0.08)),
        linear-gradient(180deg, rgba(8, 47, 73, 0.96), rgba(2, 6, 23, 0.9));
      color: #ecfeff;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 0.8px;
      box-shadow: inset 0 0 18px rgba(34, 211, 238, 0.18), 0 0 12px rgba(14, 165, 233, 0.18);
    }

    .physical-platform-chip--inline {
      min-height: 0;
      height: 50px;
      border-radius: 10px;
      font-size: 24px;
      border-color: rgba(125, 211, 252, 0.78);
    }

    .physical-summary-box {
      padding: 2px 6px 0;
    }

    .physical-summary-title {
      margin: 0 0 14px;
      color: #0b3a83;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: 0.3px;
    }

    .physical-summary-title::before {
      content: none;
    }

    .physical-summary-list {
      margin: 0;
      padding-left: 26px;
      color: #111827;
      font-size: 16px;
      line-height: 1.42;
      font-weight: 650;
    }

    .bottom-layout {
      display: contents;
    }

    .left-panel {
      display: contents;
    }

    .flow-panel,
    .controls-panel {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      background: #f9fafb;
      padding: 12px;
      display: grid;
      gap: 10px;
      min-height: 0;
      overflow: hidden;
    }

    .flow-panel {
      grid-area: flow;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .controls-panel {
      grid-area: controls;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .controls-heading {
      margin: 0;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid rgba(34, 211, 238, 0.34);
      display: flex;
      align-items: center;
      color: #0f172a;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.04em;
      background: linear-gradient(90deg, rgba(34, 211, 238, 0.12), rgba(251, 191, 36, 0.1));
    }

    .parameter-grid {
      display: grid;
      gap: 10px;
      align-content: center;
      min-height: 0;
    }

    .parameter-card {
      padding: 12px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 14px;
      background: rgba(248, 250, 252, 0.92);
      display: grid;
      gap: 4px;
    }

    .parameter-label {
      color: #475569;
      font-size: 13px;
      font-weight: 800;
    }

    .parameter-value {
      color: #0f172a;
      font-size: 18px;
      font-weight: 900;
    }

    .mode-buttons {
      grid-area: controls;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 44px 38px minmax(150px, 1fr);
      gap: 6px 12px;
      min-height: 0;
      align-content: stretch;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      background: #f9fafb;
      padding: 8px 12px;
      overflow: hidden;
    }

.mode-btn {
      order: 2;
      grid-row: 2;
      position: relative;
      z-index: 2;
      border: 1px solid #0f5f82;
      border-radius: 8px;
      background: #186487;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      padding: 7px 10px;
      min-height: 44px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .mode-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(24, 100, 135, 0.25);
    }

    .mode-btn.is-active {
      background: #0d4f6d;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.3);
    }

    .mode-btn[data-mode="centralized"] {
      grid-column: 1;
    }

    .mode-btn[data-mode="distributed"] {
      grid-column: 2;
    }

    .option-row {
      order: 1;
      grid-column: 1 / -1;
      grid-row: 1;
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      min-height: 0;
      align-items: start;
    }

    .option-line {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto 88px;
      align-items: center;
      gap: 7px;
      padding: 7px 8px;
      min-height: 46px;
      max-height: 46px;
      align-self: start;
      overflow: hidden;
      border: 1px solid rgba(125, 211, 252, 0.25);
      border-radius: 14px;
      background:
        linear-gradient(135deg, rgba(8, 47, 73, 0.72), rgba(2, 6, 23, 0.78)),
        radial-gradient(circle at 100% 0%, rgba(34, 211, 238, 0.12), transparent 38%);
      box-shadow: inset 0 0 18px rgba(34, 211, 238, 0.06);
    }

    .option-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #dbeafe;
      font-weight: 850;
      min-width: 0;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: none;
    }

    .option-item::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fbbf24;
      box-shadow: 0 0 8px rgba(251, 191, 36, 0.8);
      flex: 0 0 auto;
    }

    .count-label {
      font-size: 13px;
      color: #93c5fd;
      font-weight: 800;
      white-space: nowrap;
    }

    .count-input-wrap {
      position: relative;
      width: 88px;
      max-width: 100%;
    }

    .count-input {
      width: 100%;
      height: 34px;
      border: 1px solid rgba(125, 211, 252, 0.45);
      border-radius: 10px;
      background: rgba(2, 6, 23, 0.86);
      color: #e0f2fe;
      font-size: 14px;
      font-weight: 900;
      padding: 0 34px 0 10px;
      outline: none;
      appearance: textfield;
      -moz-appearance: textfield;
    }

    .count-input::-webkit-outer-spin-button,
    .count-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .count-input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 2px rgba(15, 118, 110, 0.14);
    }

    .count-stepper {
      position: absolute;
      right: 4px;
      top: 3px;
      bottom: 3px;
      width: 24px;
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 2px;
      padding: 1px;
      border-radius: 7px;
      background: rgba(2, 6, 23, 0.58);
      box-shadow: inset 0 0 8px rgba(34, 211, 238, 0.06);
    }

    .count-step-btn {
      border: 1px solid rgba(125, 211, 252, 0.34);
      border-radius: 5px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.9), rgba(2, 6, 23, 0.92));
      color: #bfdbfe;
      font-size: 10px;
      line-height: 1;
      padding: 0;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 8px rgba(34, 211, 238, 0.06);
    }

    .count-step-btn:hover:not(:disabled) {
      background: linear-gradient(180deg, rgba(8, 47, 73, 0.96), rgba(14, 116, 144, 0.72));
      border-color: rgba(34, 211, 238, 0.56);
      color: #67e8f9;
    }

    .count-step-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .count-input:disabled,
    .mode-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .flow-wrap {
      order: 4;
      grid-column: 1 / -1;
      grid-row: 4;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #ffffff;
      padding: 8px;
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 4px;
    }

    .flow-title {
      min-height: 24px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid rgba(34, 211, 238, 0.34);
      display: flex;
      align-items: center;
      color: #0f172a;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.08em;
      background: linear-gradient(90deg, rgba(34, 211, 238, 0.14), rgba(14, 165, 233, 0.08));
    }

    .flow-svg {
      width: 100%;
      height: 100%;
    }

    .flow-base {
      fill: none;
      stroke: #8ab8de;
      stroke-width: 20;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .flow-active {
      fill: none;
      stroke: #2563eb;
      stroke-width: 30;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 4px rgba(37, 99, 235, 0.6));
    }

    .flow-node {
      fill: #ffffff;
      stroke: #93a4b5;
      stroke-width: 3;
      transition: fill 0.3s ease, stroke 0.3s ease, r 0.3s ease;
    }

    .flow-node.is-visited {
      fill: #ffffff;
      stroke: #2563eb;
    }

    .flow-node.is-active {
      fill: #ffffff;
      stroke: #1d4ed8;
      stroke-width: 4;
    }

    .flow-label-small {
      fill: #111827;
      font-size: 18px;
      font-weight: 600;
      user-select: none;
    }

    .flow-text-label {
      fill: #111827;
      font-size: 40px;
      font-weight: 600;
      user-select: none;
    }

    .flow-status {
      order: 3;
      grid-column: 1 / -1;
      grid-row: 3;
      margin: 0;
      min-height: 38px;
      padding: 6px 14px;
      font-size: 16px;
      color: #cffafe;
      font-weight: 800;
      letter-spacing: 0.03em;
      border: 1px solid rgba(56, 189, 248, 0.22);
      border-radius: 999px;
      background: rgba(8, 47, 73, 0.28);
      display: flex;
      align-items: center;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: none;
    }

    .right-panel {
      grid-area: logs;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      min-height: 0;
    }

    .log-box {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      background: #ffffff;
      color: #3b82f6;
      padding: 12px;
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 0;
      overflow: hidden;
      font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    .log-title {
      margin: 0;
      font-size: 16px;
      color: #3b82f6;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 8px;
    }

    .log-content {
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
      font-size: 12px;
      color: #3b82f6;
      line-height: 1.6;
      overflow-y: scroll;
      overflow-x: hidden;
      scrollbar-gutter: stable;
      white-space: pre-wrap;
    }

    .log-content li {
      margin: 0 0 7px;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.12);
      background: rgba(15, 23, 42, 0.42);
      display: flex;
      gap: 6px;
      align-items: flex-start;
      word-break: break-word;
    }

    .log-content li::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fbbf24;
      margin-top: 7px;
      flex: 0 0 auto;
      box-shadow: 0 0 8px rgba(251, 191, 36, 0.8);
    }

    .log-line {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 5px;
      min-width: 0;
    }

    .log-time {
      color: #94a3b8;
    }

    .log-device {
      color: #fde68a;
      font-weight: 700;
      text-shadow: none;
    }

    .gauge-row {
      grid-area: flow;
      border: 1px solid #d1d5db;
      border-radius: 16px;
      background: #ffffff;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
      min-height: 0;
      overflow: hidden;
    }

    .gauge-card {
      flex: 1 1 0;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      background: #f8fafc;
      padding: 9px 12px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 162px;
      grid-template-rows: auto auto;
      align-items: center;
      justify-items: stretch;
      gap: 2px 12px;
      margin: 0 4px;
      min-height: 0;
    }

    .gauge-row .gauge-svg {
      grid-column: 2;
      grid-row: 1 / 3;
      max-width: 162px;
      min-height: 96px;
      align-self: center;
    }

    .gauge-title {
      margin: 0;
      width: 100%;
      font-size: 17px;
      color: #0f172a;
      font-weight: 900;
      text-align: left;
      line-height: 1.2;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
      position: relative;
      overflow: visible;
    }

    .gauge-title::before {
      content: "";
      width: 5px;
      height: 24px;
      border-radius: 999px;
      margin-right: 10px;
      background: linear-gradient(180deg, #22d3ee, #fbbf24);
      box-shadow: 0 0 10px rgba(34, 211, 238, 0.56);
      flex: 0 0 auto;
    }

    .gauge-svg {
      width: 100%;
      max-width: 200px;
      height: auto;
      display: block;
    }

    .gauge-track {
      fill: none;
      stroke: #d5dee9;
      stroke-width: 22;
      stroke-linecap: round;
    }

    .gauge-progress {
      fill: none;
      stroke: #0ea5e9;
      stroke-width: 22;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.35s ease, opacity 0.22s ease;
    }

    .gauge-needle {
      stroke: #fbbf24;
      stroke-width: 8;
      stroke-linecap: round;
      transform-origin: 110px 102px;
      transform-box: view-box;
      transition: transform 0.35s ease, opacity 0.22s ease;
      filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.9));
    }

    .gauge-center {
      fill: #fef3c7;
      stroke: #f59e0b;
      stroke-width: 3;
      filter: drop-shadow(0 0 7px rgba(251, 191, 36, 0.75));
      transition: opacity 0.22s ease;
    }

    .gauge-mark {
      fill: #64748b;
      font-size: 15px;
      font-weight: 900;
    }

    .gauge-value {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.2;
      padding-left: 15px;
      letter-spacing: 0.02em;
    }

    .gauge-card.is-hidden {
      display: grid;
    }

    .log-action {
      color: #67e8f9;
      font-weight: 700;
    }

    .log-object {
      color: #c4b5fd;
    }

    .log-message {
      color: #bfdbfe;
    }

    .log-detail {
      flex-basis: 100%;
      color: #93c5fd;
      padding-left: 2ch;
    }

    .log-header {
      border-color: rgba(251, 191, 36, 0.32) !important;
      background: rgba(30, 41, 59, 0.72) !important;
    }

    .log-header::before {
      background: #67e8f9 !important;
      box-shadow: 0 0 8px rgba(103, 232, 249, 0.8) !important;
    }

    .log-header .log-message {
      color: #fde68a;
      font-weight: 800;
    }

    @media (max-width: 1200px) {
      .page {
        height: auto;
        grid-template-columns: 1fr;
        grid-template-rows: minmax(320px, auto) minmax(360px, auto) minmax(220px, auto) minmax(320px, auto);
        grid-template-areas:
          "flow"
          "image"
          "controls"
          "logs";
        overflow: auto;
      }

      .hero-scene {
        min-height: 980px;
        overflow: auto;
      }

      .physical-hero-layout {
        grid-template-columns: 1fr;
      }

      .physical-left-stack {
        grid-template-rows: minmax(390px, 1.5fr) minmax(50px, auto);
      }

      .bottom-layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 900px) {
      .right-panel {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 700px) {
      .section {
        padding: 10px;
      }

      .mode-buttons {
        grid-template-columns: 1fr;
      }

      .option-row {
        grid-template-columns: 1fr;
      }

      .mode-btn[data-mode="centralized"],
      .mode-btn[data-mode="distributed"] {
        grid-column: 1;
      }

      .flow-label-small {
        font-size: 15px;
      }

      .physical-platform-chip {
        font-size: 22px;
      }

      .physical-summary-title {
        font-size: 22px;
      }

      .physical-summary-list {
        font-size: 16px;
      }
    }
    /* 全站科技风主题覆盖：深色背景、青蓝光效、终端化日志 */
    body {
      background:
        radial-gradient(circle at 12% 16%, rgba(34, 211, 238, 0.16), transparent 30%),
        radial-gradient(circle at 88% 12%, rgba(59, 130, 246, 0.16), transparent 32%),
        linear-gradient(rgba(34, 211, 238, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 211, 238, 0.05) 1px, transparent 1px),
        #020617;
      background-size: auto, auto, 34px 34px, 34px 34px, auto;
      color: #dbeafe;
    }

    .page,
    .section,
    .hero-section,
    .hero-scene {
      background: transparent !important;
    }

    .section + .section {
      border-top-color: rgba(125, 211, 252, 0.28);
    }

    .hero-scene,
    .diagram-panel,
    .gauge-row,
    .flow-wrap,
    .mode-buttons,
    .log-box {
      background: rgba(2, 8, 23, 0.88) !important;
      border: 1px solid rgba(34, 211, 238, 0.36) !important;
      box-shadow: inset 0 0 24px rgba(34, 211, 238, 0.08), 0 0 22px rgba(14, 165, 233, 0.16) !important;
      backdrop-filter: blur(10px);
    }

    .gauge-row .panel-header {
      margin: 4px;
    }

    .gauge-card {
      background:
        linear-gradient(135deg, rgba(8, 47, 73, 0.76), rgba(2, 6, 23, 0.82)),
        radial-gradient(circle at 100% 0%, rgba(34, 211, 238, 0.12), transparent 38%) !important;
      border-color: rgba(125, 211, 252, 0.25) !important;
      box-shadow: inset 0 0 18px rgba(34, 211, 238, 0.06);
    }

    .gauge-title {
      color: #dbeafe !important;

                <text class="gauge-mark" x="23" y="125">0%</text>
                <text class="gauge-mark" x="180" y="125">100%</text>
              </svg>
              <p class="gauge-value" id="multi-value">--</p>
            </section>

            <section class="gauge-card" id="boost-gauge-card">
              <h3 class="gauge-title">多模态相较单模态提升</h3>
              <svg class="gauge-svg" viewBox="0 0 220 118" aria-label="多模态提升仪表盘">
                <path class="gauge-track" d="M30 102 A80 80 0 0 1 190 102" />
                <path class="gauge-progress" id="boost-progress" d="M30 102 A80 80 0 0 1 190 102" />
                <line class="gauge-needle" id="boost-needle" x1="110" y1="102" x2="110" y2="34" />
                <circle class="gauge-center" cx="110" cy="102" r="5" />
                <text class="gauge-mark" x="23" y="125">0%</text>
                <text class="gauge-mark" x="173" y="125">100%</text>
              </svg>
              <p class="gauge-value" id="boost-value">--</p>
            </section>
          </div>

          <div class="mode-buttons">
            <div class="option-row">
              <div class="option-line">
                <span class="option-item">单模态接入演示</span>
                <label class="count-label" for="single-count">次数</label>
                <div class="count-input-wrap">
                  <input id="single-count" class="count-input" type="text" inputmode="numeric" value="5" placeholder="默认5（1-100）" />
                  <div class="count-stepper" aria-hidden="true">
                    <button class="count-step-btn" id="single-count-up" type="button" tabindex="-1">&#9650;</button>
                    <button class="count-step-btn" id="single-count-down" type="button" tabindex="-1">&#9660;</button>
                  </div>
                </div>
              </div>
              <div class="option-line">
                <span class="option-item">区块链增强多模态接入演示</span>
                <label class="count-label" for="multi-count">次数</label>
                <div class="count-input-wrap">
                  <input id="multi-count" class="count-input" type="text" inputmode="numeric" value="5" placeholder="默认5（1-100）" />
                  <div class="count-stepper" aria-hidden="true">
                    <button class="count-step-btn" id="multi-count-up" type="button" tabindex="-1">&#9650;</button>
                    <button class="count-step-btn" id="multi-count-down" type="button" tabindex="-1">&#9660;</button>
                  </div>
                </div>
              </div>
            </div>
            <button class="mode-btn" type="button" data-mode="centralized">单模态接入演示</button>
            <button class="mode-btn" type="button" data-mode="distributed">区块链增强多模态接入演示</button>
            <p class="flow-status" id="flow-status">正在执行：等待开始。</p>

            <div class="flow-wrap">
              <div class="flow-title">流程演示</div>
              <svg class="flow-svg" viewBox="0 0 1120 360" xmlns="http://www.w3.org/2000/svg" aria-label="物理层接入演示流程">
                <path class="flow-base" d="M50 180 L280 180" />
                <path class="flow-base" d="M280 180 C390 180 390 80 540 80" />
                <path class="flow-base" d="M540 80 L930 80" />
                <path class="flow-base" d="M280 180 C390 180 390 280 540 280" />
                <path class="flow-base" d="M540 280 L930 280" />

                <path id="active-seg-1" class="flow-active" d="M50 180 L280 180" />
                <path id="active-seg-top" class="flow-active" d="M280 180 C390 180 390 80 540 80 L930 80" />
                <path id="active-seg-bottom" class="flow-active" d="M280 180 C390 180 390 280 540 280 L930 280" />

                <circle id="node-start" class="flow-node" cx="280" cy="180" r="10" />
                <circle id="node-multi" class="flow-node" cx="540" cy="80" r="10" />
                <circle id="node-switch" class="flow-node" cx="930" cy="80" r="10" />
                <circle id="node-single" class="flow-node" cx="540" cy="280" r="10" />
                <circle id="node-backoff" class="flow-node" cx="930" cy="280" r="10" />

                <text class="flow-text-label" x="92" y="224">接入请求</text>
                <text class="flow-text-label" x="420" y="50">多模态接入</text>
                <text class="flow-text-label" x="760" y="50">接入方式切换</text>
                <text class="flow-text-label" x="420" y="326">单模态接入</text>
                <text class="flow-text-label" x="848" y="326">退避接入</text>
              </svg>
            </div>
          </div>
        </div>

        <div class="right-panel">
          <article class="log-box">
            <h3 class="log-title">单模态接入日志</h3>
            <ul class="log-content"></ul>
          </article>

          <article class="log-box">
            <h3 class="log-title">多模态接入日志</h3>
            <ul class="log-content"></ul>
          </article>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const DEFAULT_ROUNDS = 5;
      const MIN_ROUNDS = 1;
      const MAX_ROUNDS = 100;
      const SINGLE_SUCCESS_PROBABILITY = 0.62;
      const MULTI_SUCCESS_PROBABILITY = 0.9;
      const statusEl = document.getElementById('flow-status');
      const buttons = document.querySelectorAll('.mode-btn');
      const singleCountInput = document.getElementById('single-count');
      const multiCountInput = document.getElementById('multi-count');
      const singleCountUpBtn = document.getElementById('single-count-up');
      const singleCountDownBtn = document.getElementById('single-count-down');
      const multiCountUpBtn = document.getElementById('multi-count-up');
      const multiCountDownBtn = document.getElementById('multi-count-down');
      const boostGaugeCard = document.getElementById('boost-gauge-card');
      const logEls = {
        centralized: document.querySelector('.log-box:nth-child(1) .log-content'),
        distributed: document.querySelector('.log-box:nth-child(2) .log-content')
      };
      const gauges = {
        centralized: {
          progress: document.getElementById('single-progress'),
          needle: document.getElementById('single-needle'),
          value: document.getElementById('single-value'),
          min: 0,
          max: 100,
          success: 0,
          total: 0,
          format: function (v) { return v.toFixed(1) + '%'; }
        },
        distributed: {
          progress: document.getElementById('multi-progress'),
          needle: document.getElementById('multi-needle'),
          value: document.getElementById('multi-value'),
          min: 0,
          max: 100,
          success: 0,
          total: 0,
          format: function (v) { return v.toFixed(1) + '%'; }
        },
        boost: {
          progress: document.getElementById('boost-progress'),
          needle: document.getElementById('boost-needle'),
          value: document.getElementById('boost-value'),
          min: 0,
          max: 100,
          format: function (v) { return v.toFixed(1) + '%'; }
        }
      };
      const paths = {
        seg1: document.getElementById('active-seg-1'),
        top: document.getElementById('active-seg-top'),
        bottom: document.getElementById('active-seg-bottom')
      };
      const nodes = {
        start: document.getElementById('node-start'),
        multi: document.getElementById('node-multi'),
        switchNode: document.getElementById('node-switch'),
        single: document.getElementById('node-single'),
        backoff: document.getElementById('node-backoff')
      };

      const PAUSE_MS = 450;
      const NODE_BASE_R = 10;
      const NODE_ACTIVE_R = 17;
      const DURATION_MS = {
        seg1: 650,
        branchPart1: 520,
        branchPart2: 520
      };

      let animationToken = 0;
      let runCounter = 0;
      let running = false;
      const completedModes = {
        centralized: false,
        distributed: false
      };

      function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function setButtonState(mode) {
        buttons.forEach((button) => {
          button.classList.toggle('is-active', button.dataset.mode === mode);
        });
      }

      function setControlState(disabled) {
        running = disabled;
        buttons.forEach((button) => {
          button.disabled = disabled;
        });
        singleCountInput.disabled = disabled;
        multiCountInput.disabled = disabled;
        singleCountUpBtn.disabled = disabled;
        singleCountDownBtn.disabled = disabled;
        multiCountUpBtn.disabled = disabled;
        multiCountDownBtn.disabled = disabled;
      }

      function nowStamp() {
        const now = new Date();
        const date = now.toLocaleDateString('zh-CN', {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit'
        }).replace(/\//g, '-');
        return date + ' ' + now.toLocaleTimeString('zh-CN', { hour12: false });
      }

      function appendLog(mode, role, action, object, result, details) {
        const target = logEls[mode];
        if (!target) return;

        const item = document.createElement('li');
        const line = document.createElement('span');
        const time = document.createElement('span');
        const device = document.createElement('span');
        const actionSpan = document.createElement('span');
        const objectSpan = document.createElement('span');
        const content = document.createElement('span');

        line.className = 'log-line';
        time.className = 'log-time';
        device.className = 'log-device';
        actionSpan.className = 'log-action';
        objectSpan.className = 'log-object';
        content.className = 'log-message';
        time.textContent = '[' + nowStamp() + ']';
        device.textContent = '[' + role + ']';
        actionSpan.textContent = action || 'event';
        objectSpan.textContent = object || '-';
        content.textContent = '-> ' + (result || '');

        line.appendChild(time);
        line.appendChild(device);
        line.appendChild(actionSpan);
        line.appendChild(objectSpan);
        line.appendChild(content);
        (details || []).forEach((detail) => {
          const detailSpan = document.createElement('span');
          detailSpan.className = 'log-detail';
          detailSpan.textContent = '└─ ' + detail;
          line.appendChild(detailSpan);
        });
        item.appendChild(line);
        target.appendChild(item);
        target.scrollTop = target.scrollHeight;
      }

      function appendHeader(mode, title) {
        const target = logEls[mode];
        if (!target) return;

        const item = document.createElement('li');
        const line = document.createElement('span');
        const content = document.createElement('span');
        item.className = 'log-header';
        line.className = 'log-line';
        content.className = 'log-message';
        content.textContent = '=== ' + title + ' ===';
        line.appendChild(content);
        item.appendChild(line);
        target.appendChild(item);
        target.scrollTop = target.scrollHeight;
      }

      function initGauge(gauge) {
        const length = gauge.progress.getTotalLength();
        gauge.length = length;
        gauge.progress.style.strokeDasharray = String(length);
        gauge.progress.style.strokeDashoffset = String(length);
      }

      function setGauge(gauge, value) {
        if (value === null || Number.isNaN(value)) {
          gauge.value.textContent = '--';
          gauge.progress.style.strokeDashoffset = String(gauge.length);
          gauge.progress.style.opacity = '0';
          gauge.needle.style.transform = 'rotate(-90deg)';
          gauge.needle.style.opacity = '0';
          if (gauge.needle.nextElementSibling) {
            gauge.needle.nextElementSibling.style.opacity = '0';
          }
          return;
        }

        const clamped = Math.min(gauge.max, Math.max(gauge.min, value));
        const ratio = (clamped - gauge.min) / (gauge.max - gauge.min);
        const dashOffset = gauge.length * (1 - ratio);
        const angle = -90 + ratio * 180;

        gauge.progress.style.strokeDashoffset = String(dashOffset);
        gauge.progress.style.opacity = '1';
        gauge.needle.style.transform = 'rotate(' + angle + 'deg)';
        gauge.needle.style.opacity = '1';
        if (gauge.needle.nextElementSibling) {
          gauge.needle.nextElementSibling.style.opacity = '1';
        }
        gauge.value.textContent = gauge.format(clamped);
      }

      function calcRate(success, total) {
        if (total <= 0) return null;
        return (success / total) * 100;
      }

      function currentFinalRate(mode) {
        return calcRate(gauges[mode].success, gauges[mode].total);
      }

      function setBoostVisibility(visible) {
        boostGaugeCard.classList.toggle('is-hidden', !visible);
        if (!visible) {
          setGauge(gauges.boost, null);
        }
      }

      function updateBoostGauge() {
        if (completedModes.centralized && completedModes.distributed) {
          const singleRate = currentFinalRate('centralized');
          const multiRate = currentFinalRate('distributed');
          const boostRate = singleRate > 0
            ? ((multiRate - singleRate) / singleRate) * 100
            : (multiRate > 0 ? 100 : 0);
          setBoostVisibility(true);
          setGauge(gauges.boost, boostRate);
        } else {
          setBoostVisibility(false);
        }
      }

      function resetGauges() {
        gauges.centralized.success = 0;
        gauges.centralized.total = 0;
        gauges.distributed.success = 0;
        gauges.distributed.total = 0;
        completedModes.centralized = false;
        completedModes.distributed = false;
        setGauge(gauges.centralized, null);
        setGauge(gauges.distributed, null);
        updateBoostGauge();
      }

      function recordGaugeResult(mode, success) {
        const gauge = gauges[mode];
        gauge.total += 1;
        gauge.success += success ? 1 : 0;
        const currentRate = calcRate(gauge.success, gauge.total);
        setGauge(gauge, currentRate);
        updateBoostGauge();
        return currentRate;
      }

      function clampRoundCount(value) {
        return Math.min(MAX_ROUNDS, Math.max(MIN_ROUNDS, value));
      }

      function getStepperBaseCount(inputEl) {
        const raw = inputEl.value.trim();
        if (raw === '') return DEFAULT_ROUNDS;
        const parsed = Number(raw);
        if (!Number.isFinite(parsed)) return DEFAULT_ROUNDS;
        return clampRoundCount(Math.round(parsed));
      }

      function adjustRoundCount(inputEl, delta) {
        if (inputEl.disabled) return;
        inputEl.value = String(clampRoundCount(getStepperBaseCount(inputEl) + delta));
      }

      function readRoundCount(inputEl) {
        const raw = inputEl.value.trim();
        if (raw === '') return DEFAULT_ROUNDS;
        if (!/^\d+$/.test(raw)) return null;
        const value = Number(raw);
        if (value < MIN_ROUNDS || value > MAX_ROUNDS) return null;
        return value;
      }

      function shouldSucceed(mode) {
        const probability = mode === 'distributed'
          ? MULTI_SUCCESS_PROBABILITY
          : SINGLE_SUCCESS_PROBABILITY;
        return Math.random() < probability;
      }

      function enhanceStaticLogs() {
        document.querySelectorAll('.log-content li').forEach((item) => {
          if (item.querySelector('.log-line')) return;

          const raw = item.textContent.trim();
          const match = raw.match(/^(\[[^\]]+\])\s*(.*)$/);
          const line = document.createElement('span');
          const time = document.createElement('span');
          const device = document.createElement('span');
          const message = document.createElement('span');

          line.className = 'log-line';
          time.className = 'log-time';
          device.className = 'log-device';
          message.className = 'log-message';
          time.textContent = match ? match[1] : '[--:--:--]';
          device.textContent = '[物理层]';
          message.textContent = match ? match[2] : raw;

          line.appendChild(time);
          line.appendChild(device);
          line.appendChild(message);
          item.textContent = '';
          item.appendChild(line);
        });
      }

      function initPath(path) {
        const total = path.getTotalLength();
        path.dataset.total = String(total);
        path.style.transition = 'none';
        path.style.strokeDasharray = String(total);
        path.style.strokeDashoffset = String(total);
      }

      function resetPaths() {
        Object.values(paths).forEach(initPath);
      }

      function resetNodes() {
        Object.values(nodes).forEach((node) => {
          node.classList.remove('is-active', 'is-visited');
          node.setAttribute('r', String(NODE_BASE_R));
        });
      }

      function revealPathSegment(path, startOffset, endOffset, duration) {
        return new Promise((resolve) => {
          path.style.transition = 'none';
          path.style.strokeDashoffset = startOffset;
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              path.style.transition = 'stroke-dashoffset ' + duration + 'ms linear';
              path.style.strokeDashoffset = endOffset;
            });
          });
          setTimeout(resolve, duration + 40);
        });
      }

      async function pauseAtNode(node, label, token) {
        if (token !== animationToken) return;
        node.classList.add('is-visited', 'is-active');
        node.setAttribute('r', String(NODE_ACTIVE_R));
        statusEl.textContent = '\u6b63\u5728\u6267\u884c\uff1a' + label;
        await sleep(PAUSE_MS);
        if (token !== animationToken) return;
        node.classList.remove('is-active');
        node.setAttribute('r', String(NODE_BASE_R));
      }

      async function runFlow(mode, runIndex, runTotal) {
        animationToken += 1;
        const token = animationToken;
        runCounter += 1;

        setButtonState(mode);
        resetPaths();
        resetNodes();

        const flowName =
          mode === 'distributed'
            ? '区块链增强多模态接入'
            : '单模态接入';
        const success = shouldSucceed(mode);
        statusEl.textContent = '\u6b63\u5728\u6267\u884c\uff1a' + flowName + ' ' + runIndex + '/' + runTotal;
        appendHeader(
          mode,
          (mode === 'distributed' ? '多模态 WiFi/LoRa 接入请求' : '单模态 WiFi 接入请求') + ' #' + runCounter + '（' + runIndex + '/' + runTotal + '）'
        );
        await sleep(120);

        await revealPathSegment(paths.seg1, paths.seg1.dataset.total, 0, DURATION_MS.seg1);
        appendLog(mode, 'UAV-1', 'send_access_request', 'physical-access-' + runCounter, '已发送至 access_point', [
          '设备ID=UAV-1',
          '接入点开始检测WiFi/LoRa链路状态'
        ]);
        await pauseAtNode(nodes.start, '接入请求', token);
        if (token !== animationToken) return;

        if (mode === 'distributed') {
          const totalTop = Number(paths.top.dataset.total);
          const offset1 = totalTop * 0.5;
          await revealPathSegment(paths.top, totalTop, offset1, DURATION_MS.branchPart1);
          appendLog(mode, 'access_point', 'record_access_result', 'WiFi', '切换至 LoRa', [
            'WiFi信号不足'
          ]);
          appendLog(mode, 'access_point', 'record_access_result', 'UAV-1', '已记录部分失败', [
            '上报UAV-1上行信道状态'
          ]);
          await pauseAtNode(nodes.multi, '多模态认证', token);
          if (token !== animationToken) return;

          await revealPathSegment(paths.top, offset1, 0, DURATION_MS.branchPart2);
          appendLog(mode, 'access_point', 'record_access_result', 'UAV-1', '切换为 LoRa', [
            '选择模式=LoRa'
          ]);
          appendLog(mode, 'access_point', 'record_access_result', 'UAV-1', success ? '通过' : '失败', [
            '选择模式=LoRa/WiFi',
            '接入成功=' + (success ? 'true' : 'false')
          ]);
          await pauseAtNode(nodes.switchNode, '接入方式切换', token);
        } else {
          const totalBottom = Number(paths.bottom.dataset.total);
          const offset2 = totalBottom * 0.5;
          await revealPathSegment(paths.bottom, totalBottom, offset2, DURATION_MS.branchPart1);
          appendLog(mode, 'access_point', 'record_access_result', 'WiFi', '信号检测', [
            '检测到WiFi信号低于阈值'
          ]);
          appendLog(mode, 'access_point', 'record_access_result', 'UAV-1', success ? '通过' : '失败', [
            '选择模式=WiFi',
            success ? 'WiFi信号达到接入阈值' : '原因=wifi_signal_below_threshold'
          ]);
          await pauseAtNode(nodes.single, '单模态认证', token);
          if (token !== animationToken) return;

          await revealPathSegment(paths.bottom, offset2, 0, DURATION_MS.branchPart2);
          await pauseAtNode(nodes.backoff, '退避接入', token);
        }

        if (token === animationToken) {
          const currentRate = recordGaugeResult(mode, success);
          statusEl.textContent = '\u6d41\u7a0b\u5b8c\u6210\uff1a' + flowName + ' ' + runIndex + '/' + runTotal;
          
          if (mode === 'distributed') {
            appendLog(mode, 'access_point', 'calculate_access_advance', 'success_rate', success ? '通过' : '失败', [
              success ? 'LoRa/WiFi动态切换生效' : '本轮接入请求未通过',
              '当前成功/已运行=' + gauges[mode].success + '/' + gauges[mode].total,
              '当前接入成功率=' + currentRate.toFixed(1) + '%'
            ]);
          } else {
            appendLog(mode, 'access_point', 'calculate_access_advance', 'single-mode', success ? '通过' : '低于多模态方案', [
              success ? '本轮WiFi信号达到接入阈值' : '固定WiFi单模态在信号低于阈值时接入失败',
              '当前成功/已运行=' + gauges[mode].success + '/' + gauges[mode].total,
              '当前接入成功率=' + currentRate.toFixed(1) + '%'
            ]);
          }
        }
      }

      async function runModeWithCount(mode) {
        if (running) return;

        const inputEl = mode === 'distributed' ? multiCountInput : singleCountInput;
        const rounds = readRoundCount(inputEl);
        if (rounds === null) {
          appendLog(mode, 'access_point', 'validate_round_count', 'input', '参数错误', [
            '演示次数需为 ' + MIN_ROUNDS + '-' + MAX_ROUNDS + ' 的整数'
          ]);
          statusEl.textContent = '\u6b63\u5728\u6267\u884c\uff1a次数输入错误';
          return;
        }

        gauges[mode].success = 0;
        gauges[mode].total = 0;
        completedModes[mode] = false;
        setGauge(gauges[mode], null);
        updateBoostGauge();

        setControlState(true);
        try {
          for (let i = 1; i <= rounds; i += 1) {
            await runFlow(mode, i, rounds);
            if (i < rounds) {
              await sleep(100);
            }
          }
          const flowName = mode === 'distributed' ? '区块链增强多模态接入' : '单模态接入';
          const rate = currentFinalRate(mode);
          completedModes[mode] = true;
          setGauge(gauges[mode], rate);
          updateBoostGauge();
          appendLog(mode, 'access_point', 'calculate_final_success_rate', flowName, rate.toFixed(1) + '%', [
            '最终成功/总次数=' + gauges[mode].success + '/' + gauges[mode].total,
            '最终接入成功率=' + rate.toFixed(1) + '%'
          ]);
          statusEl.textContent = '\u6d41\u7a0b\u5b8c\u6210\uff1a' + flowName + '，成功率 ' + rate.toFixed(1) + '%';
        } finally {
          setControlState(false);
        }
      }

      buttons.forEach((button) => {
        button.addEventListener('click', () => {
          runModeWithCount(button.dataset.mode);
        });
      });
      singleCountUpBtn.addEventListener('click', function () { adjustRoundCount(singleCountInput, 1); });
      singleCountDownBtn.addEventListener('click', function () { adjustRoundCount(singleCountInput, -1); });
      multiCountUpBtn.addEventListener('click', function () { adjustRoundCount(multiCountInput, 1); });
      multiCountDownBtn.addEventListener('click', function () { adjustRoundCount(multiCountInput, -1); });
      Object.keys(gauges).forEach(function (key) {
        initGauge(gauges[key]);
      });
      resetPaths();
      resetNodes();
      resetGauges();
    })();
  </script>
</body>
</html>
