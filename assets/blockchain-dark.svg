<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 696 84" role="img" aria-label="区块链">
  <defs>
    <g id="chain-block">
      <polygon points="0,-18 36,0 0,18 -36,0" fill="#0e7490" stroke="#22d3ee" stroke-width="2.5" stroke-linejoin="round" />
      <polygon points="-36,0 0,18 0,48 -36,30" fill="#082f49" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" />
      <polygon points="0,18 36,0 36,30 0,48" fill="#0c4a6e" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" />
      <circle cx="0" cy="0" r="3.2" fill="#67e8f9" />
    </g>
    <polygon id="chain-node" points="0,-5 5,0 0,5 -5,0" fill="#67e8f9" />
  </defs>
  <!-- 区块间的链式连接线与节点 -->
  <g stroke="#38bdf8" stroke-width="2.5">
    <line x1="97.5" y1="42" x2="118.5" y2="42" />
    <line x1="193.5" y1="42" x2="214.5" y2="42" />
    <line x1="289.5" y1="42" x2="310.5" y2="42" />
    <line x1="385.5" y1="42" x2="406.5" y2="42" />
    <line x1="481.5" y1="42" x2="502.5" y2="42" />
    <line x1="577.5" y1="42" x2="598.5" y2="42" />
  </g>
  <g fill="#67e8f9">
    <use href="#chain-node" x="108" y="42" />
    <use href="#chain-node" x="204" y="42" />
    <use href="#chain-node" x="300" y="42" />
    <use href="#chain-node" x="396" y="42" />
    <use href="#chain-node" x="492" y="42" />
    <use href="#chain-node" x="588" y="42" />
  </g>
  <!-- 七个等距深色区块 -->
  <use href="#chain-block" x="60" y="25" />
  <use href="#chain-block" x="156" y="25" />
  <use href="#chain-block" x="252" y="25" />
  <use href="#chain-block" x="348" y="25" />
  <use href="#chain-block" x="444" y="25" />
  <use href="#chain-block" x="540" y="25" />
  <use href="#chain-block" x="636" y="25" />
</svg>
